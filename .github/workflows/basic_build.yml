name: Basic Build
run-name: "[${{ github.actor }}]: ${{ github.event_name }} to ${{ github.ref_name }}"
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64-gfortran
            runs_on: ubuntu-22.04
            compiler: gcc
            fc: gfortran
          - label: linux-aarch64-gfortran
            runs_on: ubuntu-22.04-arm
            compiler: gcc
            fc: gfortran
          - label: macos-x86_64-gfortran
            runs_on: macos-15-intel
            compiler: gcc
            fc: gfortran-14
          - label: macos-arm64-gfortran
            runs_on: macos-14
            compiler: gcc
            fc: gfortran-14
          - label: windows-amd64-ifx
            runs_on: windows-2022
            compiler: intel
            version: "2025.2"
            fc: ifx
          - label: windows-amd64-ifort
            runs_on: windows-2022
            compiler: intel-classic
            version: "2021.10"
            fc: ifort
          - label: windows-amd64-gfortran
            runs_on: windows-2022
            compiler: gcc
            fc: gfortran
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out CEA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up GNU Fortran compiler (Linux)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gfortran

      - name: Set up Fortran compiler (macOS)
        if: runner.os == 'macOS' && matrix.compiler == 'gcc'
        run: |
          brew update
          brew install gcc@14

      - name: Set up Intel oneAPI compiler (Windows)
        if: runner.os == 'Windows' && (matrix.compiler == 'intel' || matrix.compiler == 'intel-classic')
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Resolve Intel compiler path
        if: runner.os == 'Windows' && (matrix.compiler == 'intel' || matrix.compiler == 'intel-classic')
        shell: pwsh
        run: |
          $compiler = "${{ matrix.fc }}"
          $resolved = $null
          $cmd = Get-Command $compiler -ErrorAction SilentlyContinue
          if ($cmd) {
            $resolved = $cmd.Source
          } else {
            $candidates = Get-ChildItem -Path "C:\Program Files (x86)\Intel\oneAPI\compiler" -Filter "$compiler.exe" -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending
            if ($candidates.Count -gt 0) {
              $resolved = $candidates[0].FullName
            }
          }
          if (-not $resolved) {
            Write-Error "Unable to find $compiler.exe in PATH or oneAPI install path."
            exit 1
          }
          "FC=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [System.IO.Path]::GetDirectoryName($resolved) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSYS2 (Windows gfortran)
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Export MinGW gfortran path
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        run: |
          echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Remove MinGW/MSYS paths for Intel Windows builds
        if: runner.os == 'Windows' && (matrix.compiler == 'intel' || matrix.compiler == 'intel-classic')
        shell: pwsh
        run: |
          $parts = $env:PATH -split ';'
          $clean = $parts | Where-Object { $_ -and ($_ -notmatch 'mingw') -and ($_ -notmatch 'msys') -and ($_ -notmatch 'strawberry') }
          "PATH=$($clean -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja setuptools numpy cython

      - name: Record toolchain info
        run: |
          git --version
          cmake --version
          ninja --version
          if command -v gfortran &> /dev/null; then gfortran --version; fi
          if [ -n "${FC}" ]; then
            FC_BASENAME="$(basename "${FC}")"
            case "${FC_BASENAME}" in
              ifort|ifort.exe|ifx|ifx.exe)
                "${FC}" /help > /dev/null || true
                ;;
              *)
                "${FC}" --version || true
                ;;
            esac
          fi

      - name: Configure (Non-Intel Windows)
        if: runner.os != 'Windows' || matrix.compiler == 'gcc'
        run: |
          FC_COMPILER="${FC:-${{ matrix.fc }}}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_Fortran_COMPILER="${FC_COMPILER}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCEA_BUILD_TESTING=OFF \
            -DCEA_ENABLE_BIND_C=ON \
            -DCEA_ENABLE_BIND_CXX=OFF \
            -DCEA_ENABLE_BIND_PYTHON=OFF \
            -DCEA_ENABLE_BIND_MATLAB=OFF \
            -DCEA_ENABLE_BIND_EXCEL=OFF

      - name: Configure (Windows Intel)
        if: runner.os == 'Windows' && (matrix.compiler == 'intel' || matrix.compiler == 'intel-classic')
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 >nul
          cmake -S . -B build -G Ninja ^
            -DCMAKE_Fortran_COMPILER="%FC%" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCEA_BUILD_TESTING=OFF ^
            -DCEA_ENABLE_BIND_C=ON ^
            -DCEA_ENABLE_BIND_CXX=OFF ^
            -DCEA_ENABLE_BIND_PYTHON=OFF ^
            -DCEA_ENABLE_BIND_MATLAB=OFF ^
            -DCEA_ENABLE_BIND_EXCEL=OFF

      - name: Build (Non-Intel Windows)
        if: runner.os != 'Windows' || matrix.compiler == 'gcc'
        run: |
          cmake --build build

      - name: Build (Windows Intel)
        if: runner.os == 'Windows' && (matrix.compiler == 'intel' || matrix.compiler == 'intel-classic')
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 >nul
          cmake --build build

      - name: Run smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/source/cea -h

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        run: |
          ./build/source/cea.exe -h

      - name: Run smoke test (Windows Intel)
        if: runner.os == 'Windows' && (matrix.compiler == 'intel' || matrix.compiler == 'intel-classic')
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 >nul
          .\build\source\cea.exe -h

      - name: Verify C ABI library output (Unix)
        if: runner.os != 'Windows'
        run: |
          ls -la build/source/bind/c
          ls -la build/source/bind/c/libcea_bindc.* || ls -la build/source/bind/c/cea_bindc.*

      - name: Verify C ABI library output (Windows)
        if: runner.os == 'Windows'
        run: |
          ls -la build/source/bind/c
          ls -la build/source/bind/c/*cea_bindc*

      - name: Upload CLI executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cea-cli-${{ matrix.label }}
          if-no-files-found: error
          path: |
            build/source/cea
            build/source/cea.exe
            build/thermo.lib
            build/trans.lib

      - name: Upload C ABI library artifact
        uses: actions/upload-artifact@v4
        with:
          name: cea-bindc-${{ matrix.label }}
          if-no-files-found: error
          path: |
            source/bind/c/cea.h
            source/bind/c/cea_enum.h
            build/source/bind/c/libcea_bindc.so
            build/source/bind/c/libcea_bindc.dylib
            build/source/bind/c/cea_bindc.dll
            build/source/bind/c/cea_bindc.lib
            build/source/bind/c/libcea_bindc.dll.a

  pfunit-tests:
    name: pFUnit (ubuntu-22.04 / gcc 11)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out CEA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja setuptools numpy cython

      - name: Build CEA + GFE (pFUnit)
        run: |
          scripts/develop.sh -G Ninja

      - name: Rebuild data libraries (compiler-native)
        run: |
          pushd data
          ../build-dev/source/cea --compile-thermo thermo.inp
          ../build-dev/source/cea --compile-trans trans.inp
          popd

      - name: Run pFUnit tests
        env:
          GFORTRAN_ERROR_BACKTRACE: "1"
          GFORTRAN_UNBUFFERED_ALL: "1"
        run: |
          ulimit -c unlimited
          ctest --output-on-failure --test-dir build-dev -V

  python-tests:
    name: Python (ubuntu-22.04 / gcc 11)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out CEA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja pytest setuptools numpy cython

      - name: Install CEA (editable)
        run: |
          python -m pip install -e .

      - name: Import extension (no init)
        env:
          CEA_SKIP_INIT: "1"
        run: |
          python - <<'PY'
          import cea
          import cea.lib.libcea
          print("cea import ok")
          PY

      - name: Run pytest
        env:
          CEA_DATA_DIR: ${{ github.workspace }}/data
        run: |
          pytest source/bind/python/tests

  release-artifacts:
    name: Release CLI + C ABI Artifacts
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: false

      - name: Prepare release assets (unique names)
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            rel="${file#release-dist/}"
            artifact="${rel%%/*}"
            subpath="${rel#*/}"
            asset_name="${artifact}__${subpath//\//__}"
            cp "${file}" "release-assets/${asset_name}"
          done < <(find release-dist -type f -print0)

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  bindc:
    name: Build (${{ matrix.os }} / ${{ matrix.toolchain.ccompiler }} / ${{matrix.toolchain.fcompiler}})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        toolchain:
          - ccompiler: gcc
            cversion: "11"
            fcompiler: gcc
            fversion: "11"
        include:
          - os: ubuntu-24.04
            toolchain:
              ccompiler: gcc
              cversion: "13"
              fcompiler: gcc
              fversion: "13"
          - os: ubuntu-22.04
            toolchain:
              ccompiler: intel
              cversion: "2023.1"
              fcompiler: intel
              fversion: "2023.1"
          - os: ubuntu-22.04
            toolchain:
              ccompiler: intel-classic
              cversion: "2021.9"
              fcompiler: intel-classic
              fversion: "2021.9"
          - os: windows-latest
            toolchain:
              ccompiler: msvc
              cversion: latest
              fcompiler: intel
              fversion: "2025.3.2"
          - os: windows-latest
            toolchain:
              ccompiler: intel
              cversion: "2025.2"
              fcompiler: intel
              fversion: "2025.3.2"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out CEA
        uses: actions/checkout@v6

      - name: Check out GFE
        uses: actions/checkout@v6
        with:
          repository: Goddard-Fortran-Ecosystem/GFE
          path: extern/gfe
          submodules: true

      - name: Install m4 (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: choco install gnuwin32-m4 -y

      - name: Work around GFE unconditional -g flag on Windows ifx (Windows Intel)
        if: ${{ runner.os == 'Windows' && matrix.toolchain.fcompiler == 'intel' }}
        run: |
          # fArgParse's and yaFyaml's cmake/IntelLLVM.cmake set CMAKE_Fortran_FLAGS
          # (applied to every build type, not just Debug) to a string starting
          # with bare "-g ". Their sibling submodules (gFTL, gFTL-shared) already
          # special-case WIN32 for this, but these two don't, and ifx's Windows
          # driver rejects bare "-g" as an ambiguous prefix ("option '/g' is
          # ambiguous") since several long-form flags also start with 'g'. Patch
          # both files to use the unambiguous Windows debug-info flag instead.
          for f in extern/gfe/fArgParse/cmake/IntelLLVM.cmake extern/gfe/yaFyaml/cmake/IntelLLVM.cmake; do
            sed -i 's/^set(CMAKE_Fortran_FLAGS "-g /set(CMAKE_Fortran_FLAGS "-debug:full /' "$f"
          done

      - name: Work around yaFyaml/pFlogger's Windows ifx 2025.2 FPP wrapper mangling paths (Windows Intel)
        if: ${{ runner.os == 'Windows' && matrix.toolchain.fcompiler == 'intel' }}
        shell: python
        run: |
          import pathlib

          # yaFyaml's and pFlogger's cmake/IntelLLVM.cmake are identical here:
          # both work around a real ifx 2025.2 FPP bug (confirmed: using ifx's
          # native -fpp directly produces bogus "#error: number of arguments
          # doesn't match" in Lexer.F90) by routing preprocessing through an
          # external "cpp"/clang-cpp binary. Their Windows .bat wrapper
          # forwards "%*" straight through to that binary, which then drops
          # the backslashes from the Windows source path it's handed
          # ("D:\a\...\Tokens.F90" arrives as "D:a...Tokens.F90"), so every
          # file fails with "no such file or directory". The wrapper was
          # written without a Windows ifx system to test on (see GFE's own
          # comment above it). Normalize backslashes to forward slashes in
          # the wrapper's arguments before forwarding them, rather than
          # bypassing the workaround (which just trades this failure for the
          # underlying FPP bug it exists to avoid).
          #
          # Both submodules are add_subdirectory()'d into the same top-level
          # GFE build, so they share one CMAKE_BINARY_DIR and both write to
          # the exact same "${CMAKE_BINARY_DIR}/tools/cpp_no_lines.bat" path
          # -- patching only one leaves the other's unpatched file(WRITE)
          # clobbering it later in the configure, so both need the fix.
          old = (
              '    file(WRITE "${cpp_wrapper}.bat"\n'
              '"@echo off\\r\n'
              '\\"${cpp_exe}\\" -P -traditional-cpp -undef %*\\r\n'
              '")'
          )
          new = (
              '    file(WRITE "${cpp_wrapper}.bat"\n'
              '"@echo off\\r\n'
              'set ARGS=%*\\r\n'
              'set ARGS=%ARGS:\\\\=/%\\r\n'
              '\\"${cpp_exe}\\" -P -traditional-cpp -undef %ARGS%\\r\n'
              '")'
          )
          for rel in (
              "extern/gfe/yaFyaml/cmake/IntelLLVM.cmake",
              "extern/gfe/pFlogger/cmake/IntelLLVM.cmake",
          ):
              path = pathlib.Path(rel)
              text = path.read_text()
              count = text.count(old)
              assert count == 1, f"{rel}: expected 1 match, got {count}"
              path.write_text(text.replace(old, new))

      - name: Set up Fortran compiler
        if: ${{ runner.os == 'Linux' || (runner.os == 'Windows' && matrix.toolchain.fcompiler != 'gcc') }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.fcompiler }}
          version: ${{ matrix.toolchain.fversion }}

      - name: Fix stale CC/CXX=icx for oneAPI 2025.3.x (Windows Intel)
        if: ${{ runner.os == 'Windows' && matrix.toolchain.fcompiler == 'intel' }}
        run: |
          # fortran-lang/setup-fortran hardcodes CC=CXX=icx, but oneAPI's
          # Windows package no longer ships a plain icx.exe as of 2025.3.x --
          # only icx-cc.exe (GCC-style driver) and icx-cl.exe (MSVC cl-style
          # driver). This breaks GFE's own pFUnit subdirectory, which enables
          # C language directly and can't resolve CC=icx at all. Use the
          # GCC-style driver, matching the Unix-style flags GFE's and our
          # own CMake configuration already assume.
          echo "CC=icx-cc" >> "$GITHUB_ENV"
          echo "CXX=icx-cc" >> "$GITHUB_ENV"

      - name: Set up Fortran compiler (macOS, gfortran)
        if: ${{ runner.os == 'macOS' && matrix.toolchain.fcompiler == 'gcc' }}
        run: |
          brew update
          brew install gcc@14
          echo "FC=gfortran-14" >> "$GITHUB_ENV"

      - name: Set up Fortran compiler (Windows, gfortran)
        if: ${{ runner.os == 'Windows' && matrix.toolchain.fcompiler == 'gcc' }}
        run: |
          # Use pre-installed MinGW on Windows runners to avoid Chocolatey issues
          # GitHub Actions windows-latest runners include MinGW in C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          if (Test-Path $mingwPath) {
            echo "$mingwPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "FC=$mingwPath\gfortran.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            # Fallback: search for gfortran in common locations
            $gfortran = Get-Command gfortran -ErrorAction SilentlyContinue
            if ($gfortran) {
              echo "FC=$($gfortran.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              Write-Error "gfortran not found on Windows runner"
              exit 1
            }
          }
        shell: pwsh

      - name: Set up MSVC toolchain (Windows MSVC/Intel)
        if: ${{ runner.os == 'Windows' && (matrix.toolchain.ccompiler == 'msvc' || matrix.toolchain.fcompiler == 'intel') }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Remove MinGW/MSYS paths for Windows Intel builds
        if: ${{ runner.os == 'Windows' && matrix.toolchain.fcompiler == 'intel' }}
        shell: pwsh
        run: |
          $parts = $env:PATH -split ';'
          $clean = $parts | Where-Object { $_ -and ($_ -notmatch 'mingw') -and ($_ -notmatch 'msys') -and ($_ -notmatch 'strawberry') }
          "PATH=$($clean -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja setuptools numpy cython

      - name: Record toolchain info
        run: |
          git --version
          cmake --version
          ninja --version
          if command -v gfortran &> /dev/null; then gfortran --version; fi
          if [ -n "${FC}" ]; then "${FC}" --version; fi

      - name: Configure and Build GFE
        run: |
          gfe_cmake_flags=()
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.toolchain.fcompiler }}" = "gcc" ]; then
            # gfortran's -cpp preprocessor does not predefine _WIN32 the way a
            # C/C++ compiler does, but pFUnit's FUnit.F90 guards its
            # `use pf_RegexFilter` on `#ifndef _WIN32`; see scripts/develop.sh
            # for the same workaround used there.
            gfe_cmake_flags+=(-DCMAKE_Fortran_FLAGS=-D_WIN32)
          fi

          cmake -S extern/gfe -B build/extern/gfe -GNinja \
            -DCMAKE_INSTALL_PREFIX=build/install \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_MPI=YES \
            -DSKIP_OPENMP=YES \
            -DSKIP_FHAMCREST=YES \
            -DSKIP_ESMF=YES \
            -DSKIP_ROBUST=YES \
            "${gfe_cmake_flags[@]}"
          cmake --build build/extern/gfe --target install

      - name: Debug - locate clang.exe (Windows Intel)
        if: ${{ always() && runner.os == 'Windows' && matrix.toolchain.fcompiler == 'intel' }}
        run: |
          echo "--- full contents of oneAPI compiler bin dir ---"
          ls -la "$ONEAPI_ROOT/compiler/latest/bin"
          echo "--- search for clang*.exe under oneAPI root ---"
          find "$ONEAPI_ROOT" -iname "clang*.exe" 2>&1
          echo "--- Intel installer log files under user temp ---"
          find /c/Users -maxdepth 6 -iname "*.log" -newermt "-2 hours" 2>/dev/null | grep -iv "npm\|pip\|vcpkg" || true
          echo "--- grep those logs for cpp-dpcpp-common / error / fail ---"
          find /c/Users -maxdepth 6 -iname "*.log" -newermt "-2 hours" 2>/dev/null | grep -iv "npm\|pip\|vcpkg" | xargs -I{} sh -c 'echo ">>> {}"; grep -i -E "cpp-dpcpp|error|fail|skip" "{}" | head -20' 2>/dev/null || true

      - name: Configure (Ninja)
        if: ${{runner.os != 'Windows' || matrix.toolchain.ccompiler != 'msvc'}}
        run: |
          cmake_fortran_flags=()
          if [ "${{ matrix.toolchain.fcompiler }}" = "gcc" ]; then
            # This is a gfortran-only flag; Windows ifx fails compiler detection with it.
            cmake_fortran_flags+=(-DCMAKE_Fortran_FLAGS="-ffree-line-length-none")
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=build/install \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCEA_BUILD_TESTING=ON \
            -DCEA_ENABLE_BIND_C=ON \
            -DCEA_ENABLE_BIND_CXX=OFF \
            -DCEA_ENABLE_BIND_PYTHON=OFF \
            -DCEA_ENABLE_BIND_MATLAB=OFF \
            -DCEA_ENABLE_BIND_EXCEL=OFF \
            "${cmake_fortran_flags[@]}"

      - name: Configure (msvc)
        if: ${{runner.os == 'Windows' && matrix.toolchain.ccompiler == 'msvc'}}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=build/install \
            -DCMAKE_BUILD_TYPE=Release \
            -DCEA_BUILD_TESTING=ON \
            -DCEA_ENABLE_BIND_C=ON \
            -DCEA_ENABLE_BIND_CXX=OFF \
            -DCEA_ENABLE_BIND_PYTHON=OFF \
            -DCEA_ENABLE_BIND_MATLAB=OFF \
            -DCEA_ENABLE_BIND_EXCEL=OFF \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON

      - name: Build
        run: |
          cmake --build build

      - name: Run smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/source/cea -h

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ./build/source/cea.exe -h

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure
