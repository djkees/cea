name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build doxygen

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # breathe 5.0.0 crashes on the Fortran API page (bitfield is None)
          python -m pip install sphinx setuptools
          git clone https://github.com/breathe-doc/breathe "$RUNNER_TEMP/breathe"
          git -C "$RUNNER_TEMP/breathe" checkout aa52a91185329f00ece9e4b5a0b1a2396bb4eed8
          (cd "$RUNNER_TEMP/breathe" && python xml_parser_generator/setuptools_builder.py)
          python -m pip install "$RUNNER_TEMP/breathe"

      # Optional: regenerate Doxygen XML
      - name: Build Doxygen XML
        run: doxygen Doxyfile

      - name: Build Sphinx HTML
        env:
          CEA_SKIP_INIT: "1"
        run: |
          cd docs
          make html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
